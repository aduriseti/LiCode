<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Induction Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #ffffff; color: #1f2937; }
        .log-entry { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .modal { transition: opacity 0.2s ease; }
        body.modal-active { overflow: hidden; }
        .dense-panel { padding: 1rem; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden text-[13px]">
    <header class="flex justify-between items-center bg-white px-4 py-2 border-b border-gray-200 z-10 shadow-sm">
        <div class="flex items-center gap-3">
            <h1 class="text-base font-bold text-gray-800 uppercase tracking-tighter">Market Dashboard</h1>
            <div id="status" class="px-2 py-0.5 rounded text-[10px] font-bold bg-yellow-100 text-yellow-700">Connecting</div>
        </div>
        <div id="round-info" class="text-xs font-bold text-blue-600"></div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <!-- Left: Charts -->
        <div class="flex flex-col w-3/5 border-r border-gray-200">
            <div class="flex-1 dense-panel border-b border-gray-200 flex flex-col min-h-0">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Asset Confidence</h2>
                <div class="flex-1 relative"><canvas id="priceChart"></canvas></div>
            </div>
            <div class="flex-1 dense-panel flex flex-col min-h-0">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Agent Wealth</h2>
                <div class="flex-1 relative"><canvas id="wealthChart"></canvas></div>
            </div>
        </div>

        <!-- Middle: Data -->
        <div class="flex flex-col w-1/4 border-r border-gray-200 bg-gray-50/50">
            <div class="flex-1 dense-panel border-b border-gray-200 overflow-hidden flex flex-col">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Assets</h2>
                <div id="tables" class="flex-1 overflow-y-auto pr-1"></div>
            </div>
            <div class="flex-1 dense-panel overflow-hidden flex flex-col">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Traders</h2>
                <div id="agents-table" class="flex-1 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- Right: Logs -->
        <div class="flex flex-col flex-1 bg-white">
            <div class="p-3 border-b border-gray-100">
                <h2 class="text-[10px] font-bold text-gray-400 uppercase">Live Stream</h2>
            </div>
            <div id="logs" class="flex-1 overflow-y-auto p-3 whitespace-pre-wrap font-mono text-[11px] leading-tight"></div>
        </div>
    </main>

    <!-- Modal -->
    <div id="agent-modal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50 p-4">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm" onclick="toggleModal()"></div>
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded shadow-2xl z-50 flex flex-col overflow-hidden border border-gray-200">
            <div class="px-6 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="font-bold text-gray-800" id="modal-title"></h3>
                <button onclick="toggleModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold transition-colors">&times;</button>
            </div>
            <div id="modal-body" class="flex-1 overflow-y-auto p-6 bg-white font-mono text-[12px] text-gray-700"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const state = { round: 0, agentTraces: {} };
        const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6366f1', '#14b8a6', '#f97316', '#06b6d4', '#84cc16', '#d946ef'];

        // Elements
        const statusEl = document.getElementById('status');
        const logsEl = document.getElementById('logs');
        const roundInfoEl = document.getElementById('round-info');
        const tablesEl = document.getElementById('tables');
        const agentsEl = document.getElementById('agents-table');
        const modalBody = document.getElementById('modal-body');
        const modalTitle = document.getElementById('modal-title');

        // Charts
        const createChart = (id, options) => {
            const ctx = document.getElementById(id)?.getContext('2d');
            if (!ctx) return { data: { labels: [], datasets: [] }, update: () => {}, destroy: () => {} };
            try {
                return new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        elements: { point: { radius: 1 }, line: { borderWidth: 1.5, tension: 0.1 } },
                        plugins: { legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 6, font: { size: 9 } } } },
                        scales: { x: { display: false }, y: { grid: { color: '#f9fafb' }, ticks: { font: { size: 9 } }, ...options.y } }
                    }
                });
            } catch (e) {
                console.warn(`Chart ${id} failed:`, e);
                return { data: { labels: [], datasets: [] }, update: () => {} };
            }
        };

        const priceChart = createChart('priceChart', { y: { min: 0, max: 1 } });
        const wealthChart = createChart('wealthChart', { y: {} });

        socket.on('connect', () => {
            statusEl.textContent = 'ONLINE';
            statusEl.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-700";
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'OFFLINE';
            statusEl.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-700";
        });

        socket.on('log', (data) => {
            if (data.type === 'log') {
                const line = document.createElement('div');
                line.className = 'log-entry mb-0.5 border-b border-gray-50 pb-0.5 text-gray-500';
                line.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${data.message}`;
                logsEl.appendChild(line);
                logsEl.scrollTop = logsEl.scrollHeight;
            } else if (data.type === 'state') {
                updateState(data);
            } else if (data.type === 'agent_init') {
                const line = document.createElement('div');
                line.className = 'log-entry mb-1 text-blue-600 font-bold';
                line.textContent = `[SYSTEM] Agent ${data.agent_id} attached`;
                logsEl.appendChild(line);
            } else if (data.type === 'agent_trace') {
                if (!state.agentTraces[data.agent_id]) state.agentTraces[data.agent_id] = [];
                state.agentTraces[data.agent_id].push(data);
            }
        });

        function getOrCreateDataset(chart, label, colorIdx) {
            let ds = chart.data.datasets.find(d => d.label === label);
            if (!ds) {
                ds = {
                    label: label,
                    data: new Array(Math.max(0, chart.data.labels.length - 1)).fill(null),
                    borderColor: COLORS[colorIdx % COLORS.length],
                    backgroundColor: COLORS[colorIdx % COLORS.length],
                    fill: false,
                    borderWidth: 1.5
                };
                chart.data.datasets.push(ds);
            }
            return ds;
        }

        function updateState(data) {
            const isNewRound = state.round !== data.round_num;
            state.round = data.round_num;
            roundInfoEl.textContent = `ROUND ${state.round}`;

            const label = `R${state.round}`;
            if (priceChart.data.labels[priceChart.data.labels.length - 1] !== label) {
                priceChart.data.labels.push(label);
                wealthChart.data.labels.push(label);
            }

            // Assets Table & Chart
            let assetHtml = '<table class="w-full text-left text-[10px] table-auto border-collapse"><thead><tr class="text-gray-400 border-b border-gray-100 uppercase text-[9px]"><th class="pb-1 font-bold">Asset</th><th class="pb-1 text-right font-bold">Price</th><th class="pb-1 text-center font-bold w-12">Conf</th></tr></thead><tbody>';
            
            Object.entries(data.assets).sort(([,a], [,b]) => a.type.localeCompare(b.type)).forEach(([id, asset], idx) => {
                const price = asset.q_yes !== undefined ? calcPrice(asset.q_yes, asset.q_no, data.liquidity_b) : 0.5;
                const ds = getOrCreateDataset(priceChart, id, idx);
                
                // Only push if it's a new round OR if this is the first data point for this dataset
                if (isNewRound || ds.data.length < priceChart.data.labels.length) {
                    ds.data.push(price);
                } else {
                    // Update current point
                    ds.data[ds.data.length - 1] = price;
                }

                const width = Math.min(100, price * 100);
                const barColor = price > 0.8 ? 'bg-green-500' : (price < 0.2 ? 'bg-red-500' : 'bg-blue-400');
                assetHtml += `<tr class="hover:bg-gray-100 transition-colors border-b border-gray-50">
                    <td class="py-1 font-mono text-gray-600 truncate max-w-[100px]" title="${id}">${id} <span class="opacity-40 font-sans">${asset.type[0]}</span></td>
                    <td class="py-1 text-right font-bold text-gray-800 font-mono">${price.toFixed(3)}</td>
                    <td class="py-1 flex justify-center"><div class="h-1 w-8 bg-gray-200 rounded-full mt-1.5 overflow-hidden"><div class="${barColor} h-full transition-all duration-500" style="width: ${width}%"></div></div></td>
                </tr>`;
            });
            tablesEl.innerHTML = assetHtml + '</tbody></table>';
            priceChart.update();

            // Traders Table & Chart
            let agentHtml = '<table class="w-full text-left text-[10px] border-collapse"><thead><tr class="text-gray-400 border-b border-gray-100 uppercase text-[9px]"><th class="pb-1 font-bold">Trader</th><th class="pb-1 text-right font-bold pr-1">Wealth</th></tr></thead><tbody>';
            
            const allTraders = Object.values(data.agents).map(a => ({...a, type: 'AGENT'}));
            allTraders.push({ agent_id: 'Whale', wealth: data.whale_wealth, type: 'WHALE' });
            allTraders.sort((a, b) => b.wealth - a.wealth);

            allTraders.forEach((trader, idx) => {
                const ds = getOrCreateDataset(wealthChart, trader.agent_id, idx);
                if (isNewRound || ds.data.length < wealthChart.data.labels.length) {
                    ds.data.push(trader.wealth);
                } else {
                    ds.data[ds.data.length - 1] = trader.wealth;
                }

                const isWhale = trader.type === 'WHALE';
                agentHtml += `<tr class="${isWhale ? 'bg-blue-50/50' : 'hover:bg-blue-50 cursor-pointer'} transition-colors border-b border-gray-50" onclick="${isWhale ? '' : `openAgent('${trader.agent_id}')`}">
                    <td class="py-1 font-mono ${isWhale ? 'text-gray-900 font-bold' : 'text-blue-600'} px-1">${trader.agent_id}</td>
                    <td class="py-1 text-right font-mono text-gray-800 pr-1">$${trader.wealth.toFixed(0)}</td>
                </tr>`;
            });
            agentsEl.innerHTML = agentHtml + '</tbody></table>';
            wealthChart.update();
        }

        function calcPrice(q_yes, q_no, b) {
            if (b <= 0) return 0.5;
            const exp = (q_no - q_yes) / b;
            if (exp > 700) return 0;
            if (exp < -700) return 1;
            return 1 / (1 + Math.exp(exp));
        }

        function openAgent(agentId) {
            modalTitle.innerHTML = `<span class="text-blue-600 font-mono">${agentId}</span> <span class="text-gray-400 font-normal">Session Logs</span>`;
            const traces = state.agentTraces[agentId] || [];
            modalBody.innerHTML = traces.length === 0 ? '<div class="text-gray-400 italic text-center py-20">No traces available for this session.</div>' : 
                traces.map((t, i) => `<div class="mb-10 relative">
                    <div class="text-[10px] font-bold uppercase text-gray-400 mb-2 flex justify-between"><span>Interaction #${i + 1}</span> <span>${t.timestamp}</span></div>
                    <div class="bg-gray-50 border border-gray-100 p-4 rounded mb-4 text-gray-600 border-l-4 border-l-gray-300"><b>PROMPT:</b><br>${escapeHtml(t.prompt)}</div>
                    <div class="bg-white border border-gray-100 p-4 rounded text-gray-800 shadow-sm border-l-4 ${t.error ? 'border-l-red-500' : 'border-l-green-500'}"><b>RESPONSE:</b><br>${t.error ? `<span class="text-red-600 font-bold">${t.error}</span>` : escapeHtml(t.response)}</div>
                </div>`).join('');
            toggleModal();
        }

        function toggleModal() {
            document.getElementById('agent-modal').classList.toggle('opacity-0');
            document.getElementById('agent-modal').classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : "";
        }
    </script>
</body>
</html>
